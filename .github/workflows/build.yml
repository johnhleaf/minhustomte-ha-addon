name: Build MinHustomte Hub Agent
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "minhustomte_agent/**"
      - ".github/workflows/build.yml"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        shell: bash
        run: |
          V=$(grep '^version:' minhustomte_agent/config.yaml | head -1 | sed 's/version:[[:space:]]*//;s/"//g')
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./minhustomte_agent
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=multi
          tags: |
            ghcr.io/johnhleaf/minhustomte-ha-addon:${{ steps.version.outputs.version }}
            ghcr.io/johnhleaf/minhustomte-ha-addon:latest
